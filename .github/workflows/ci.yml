name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docnear_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docnear_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/docnear_ci
      SECRET_KEY: ci-only-secret-key-that-is-never-used-outside-github-actions
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      DJANGO_SETTINGS_MODULE: config.settings.test
      OTP_SMS_PROVIDER: console
      OTP_TEST_CODE: "111111"
      TELEGRAM_BOT_TOKEN: dummy-ci-token
      TELEGRAM_BOT_USERNAME: dummy_bot
      TELEGRAM_BOT_WEBHOOK_SECRET: dummy-ci-secret
      TELEGRAM_OTP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Django system check
        run: python backend/manage.py check --settings=config.settings.test
      - name: Verify migration files
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Apply migrations
        run: python backend/manage.py migrate --noinput --settings=config.settings.test
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest -q

  patient-web:
    name: Patient web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/patient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/patient/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm audit --audit-level=high
      - run: npm run build

  doctor-panel:
    name: Doctor panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/doctor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build

  admin-panel:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build

  clinic-owner-panel:
    name: Clinic owner panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/clinic-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/clinic-owner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build

  flutter-mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:8001/api/v1/
