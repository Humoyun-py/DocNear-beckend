services:
  backend:
    build: .
    env_file: .env.staging
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --config /app/deploy/gunicorn.conf.py'
    volumes:
      - staging_static:/app/backend/staticfiles
      - staging_media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy", "--settings=config.settings.production"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  telegram-bot:
    build: .
    env_file: .env.staging
    command: python manage.py run_telegram_bot --settings=config.settings.production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docnear_staging}
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for staging}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docnear.staging.conf.example:/etc/nginx/conf.d/default.conf:ro
      - staging_static:/var/www/static:ro
      - staging_media:/var/www/media:ro
      - ./deploy/certs/staging:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staging_postgres:
  staging_redis:
  staging_static:
  staging_media:
