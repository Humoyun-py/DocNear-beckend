          format: date
      - in: query
        name: doctor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: past
        schema:
          type: boolean
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: specialty
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - confirmed
          - in_progress
          - no_show
          - pending
          - rejected
          - waiting
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `waiting` - Waiting
          * `in_progress` - In progress
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `rejected` - Rejected
          * `no_show` - No show
      - in: query
        name: this_week
        schema:
          type: boolean
      - in: query
        name: today
        schema:
          type: boolean
      - in: query
        name: tomorrow
        schema:
          type: boolean
      - in: query
        name: upcoming
        schema:
          type: boolean
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
