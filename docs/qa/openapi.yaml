  /api/admin-panel/notifications/:
    get:
      operationId: admin_panel_notifications_list
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - appointment_reminder
          - booking_cancelled
          - booking_confirmed
          - booking_created
          - booking_rescheduled
          - booking_updated
          - clinic_verification
          - doctor_schedule_changed
          - doctor_verification
          - general
          - system_message
        description: |-
          * `booking_created` - booking created
          * `booking_confirmed` - booking confirmed
          * `booking_cancelled` - booking cancelled
          * `booking_rescheduled` - booking rescheduled
          * `booking_updated` - booking updated
          * `appointment_reminder` - appointment reminder
          * `doctor_schedule_changed` - doctor schedule changed
          * `doctor_verification` - doctor verification
          * `clinic_verification` - clinic verification
          * `system_message` - system message
          * `general` - general
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
